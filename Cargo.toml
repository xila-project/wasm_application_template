[package]
name = "xila-wasm-app"
version = "0.1.0"
edition = "2024"
description = "A starter Rust WebAssembly application for Xila."

[profile.release]
lto = true
opt-level = "s"
strip = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm = { git = "https://github.com/Xila-Project/Core", package = "wasm", default-features = false, features = [
  "guest",
  "memory_32",
] }
